<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصة محاضر الاجتماعات الذكية</title>

<style>

body{
font-family:'Tahoma',sans-serif;
background:#f4f7fb;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#0f4c81;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:15px;
}

.field{
display:flex;
flex-direction:column;
}

label{
margin-bottom:5px;
font-weight:bold;
color:#333;
}

input,select,textarea{
padding:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

textarea{
height:120px;
}

.readonly{
background:#eef4ff;
}

button{
background:#0f4c81;
color:white;
border:none;
padding:15px;
margin-top:20px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1467aa;
}

.table{
margin-top:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0f4c81;
color:white;
padding:10px;
}

td{
border:1px solid #ddd;
padding:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>📋 منصة محاضر الاجتماعات الذكية</h1>

<div class="grid">

<div class="field">
<label>اسم المدرسة</label>
<input type="text" value="مدرسة ............ الابتدائية" readonly class="readonly">
</div>

<div class="field">
<label>تاريخ الاجتماع</label>
<input type="date" id="date">
</div>

<div class="field">
<label>نوع المحضر</label>
<select>
<option>محضر اجتماع لجنة</option>
<option>محضر اجتماع فريق</option>
<option>اجتماع إداري</option>
</select>
</div>

<div class="field">
<label>اسم اللجنة أو الفريق</label>
<select id="committee" onchange="generateData()">

<option value="">اختر</option>

<option>لجنة التوجيه الطلابي</option>
<option>لجنة الأمن والسلامة</option>
<option>لجنة التحصيل الدراسي</option>
<option>فريق الجودة</option>
<option>فريق التحول الرقمي</option>
<option>فريق النشاط الطلابي</option>

</select>
</div>

<div class="field">
<label>مكان الاجتماع</label>
<select>

<option>غرفة مصادر التعلم</option>
<option>غرفة المدير</option>
<option>غرفة الوكيل</option>

</select>
</div>

<div class="field">
<label>إجمالي الحضور</label>

<select>

<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>10</option>
<option>15</option>
<option>20</option>
<option>30</option>
<option>40</option>
<option>50</option>
<option>60</option>

</select>

</div>

</div>

<br>

<div class="field">
<label>الهدف من الاجتماع</label>
<textarea id="goal" class="readonly"></textarea>
</div>

<br>

<div class="field">
<label>أبرز المحاور والنقاط المثارة</label>
<textarea id="topics" class="readonly"></textarea>
</div>

<br>

<div class="field">
<label>أبرز التوصيات الصادرة</label>
<textarea id="recommendations" class="readonly"></textarea>
</div>

<div class="table">

<h3>بيان حضور الاجتماع</h3>

<table>

<tr>
<th>م</th>
<th>اسم الحاضر</th>
<th>التوقيع</th>
</tr>

<tr>
<td>1</td>
<td>
<select>
<option>خالد شاقي الرويلي</option>
<option>محمد العنزي</option>
<option>أحمد الشراري</option>
<option>سعود الرويلي</option>
</select>
</td>
<td></td>
</tr>

</table>

</div>

<br>

<div class="grid">

<div class="field">
<label>معد التقرير</label>
<input type="text" value="مساعد إداري / خالد شاقي الرويلي" readonly class="readonly">
</div>

<div class="field">
<label>مشرف الدعم</label>

<select>

<option>مشرف الدعم</option>
<option>المنسق الإعلامي</option>
<option>منسق الجودة</option>

</select>

</div>

</div>

<button onclick="window.print()">
🖨️ طباعة المحضر
</button>

</div>

<script>

document.getElementById("date").value =
new Date().toISOString().split('T')[0];

function generateData(){

let committee =
document.getElementById("committee").value;

let goal =
document.getElementById("goal");

let topics =
document.getElementById("topics");

let recommendations =
document.getElementById("recommendations");

if(committee=="لجنة الأمن والسلامة"){

goal.value="مراجعة إجراءات الأمن والسلامة ورفع مستوى الجاهزية بالمدرسة.";

topics.value=
"مخارج الطوارئ.\nخطة الإخلاء.\nمعدات السلامة.\nتوعية الطلاب.";

recommendations.value=
"تحديث خطة الإخلاء.\nتنفيذ فرضية إخلاء.\nفحص الطفايات.";

}

else if(committee=="فريق الجودة"){

goal.value=
"تحسين الأداء المؤسسي ورفع جودة العمليات التعليمية.";

topics.value=
"مؤشرات الأداء.\nنتائج الزيارات.\nخطط التحسين.";

recommendations.value=
"إعداد خطة تحسين.\nمتابعة التنفيذ.\nرفع التقارير الدورية.";

}

else if(committee=="لجنة التحصيل الدراسي"){

goal.value=
"تحسين مستوى التحصيل الدراسي للطلاب.";

topics.value=
"نتائج الاختبارات.\nالطلاب المتعثرون.\nالخطط العلاجية.";

recommendations.value=
"تنفيذ برامج علاجية.\nمتابعة الأداء.\nالتواصل مع أولياء الأمور.";

}

}

</script>

</body>
</html>
